name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static app
        run: |
          test -f index.html
          test -f app.js
          test -f sw.js
          test -f manifest.webmanifest
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          node --check app.js
          node --check sw.js
          node --check structure.js
          node --check engine.js
          node --check office.js
          node --test tests/*.test.cjs
          node -e "const m=JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); if(m.start_url!=='/anonymise/'||m.scope!=='/anonymise/')process.exit(1)"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
